controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    wheel_radius: 0.07625
    wheel_track: 0.4
    wheel_base: 0.4
    odom_pub_en: true
    #    global_vel_cmd: true
    linear_max_acceleration: 2.0
    angular_max_acceleration: 4.0


  hero_gimbal_controller:
    type: hero_gimbal_controller/HeroGimbalController


  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50