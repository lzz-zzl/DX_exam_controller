controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    odom_pub_en: true
    wheel_radius: 0.07625
    wheel_track: 0.4
    wheel_base: 0.4
    linear_max_acceleration: 3.0
    angular_max_acceleration: 8.0

  hero_gimbal_controller:
    type: hero_gimbal_controller/HeroGimbalController
    imu_name: gimbal_imu
    enable_gravity_compensation_: true
    gravity_: 9.81
    gimbal_mass: 1.488528
    mass_origin_x: 0.08347
    mass_origin_z: 0.03654

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100


wheel_pid_params:
  p: 0.5
  i: 0.0
  d: 0.0
  i_clamp: 4

follow_pid_params:
  p: 4.0
  i: 0.0
  d: 12.0
  i_clamp: 4